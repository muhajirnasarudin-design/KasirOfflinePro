name: Build Android APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-latest
steps:
- name: Checkout repository
uses: actions/checkout@v4
- name: Set up Java
uses: actions/setup-java@v4
with:
distribution: temurin
java-version: "17"
- name: Set up Python
uses: actions/setup-python@v5
with:
python-version: "3.11"
- name: Install dependencies
run: sudo apt-get update && sudo apt-get install -y git zip unzip autoconf automake libtool pkg-config zlib1g-dev libncurses-dev libffi-dev libssl-dev libltdl-dev cmake
- name: Install Buildozer
run: pip install --upgrade pip setuptools wheel buildozer cython==0.29.36
- name: Build APK
run: buildozer -v android debug
- name: Upload APK
uses: actions/upload-artifact@v4
with:
name: KasirOfflinePro-debug-apk
path: bin/*.apk
if-no-files-found: error
